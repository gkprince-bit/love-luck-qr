
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love & Luck Surprise</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: Arial;
  color: white;
  background: linear-gradient(135deg,#ff4e88,#7028a0);
  overflow: hidden;
}
.card { padding: 25px; position: relative; z-index: 2; }
#emoji { font-size: 75px; animation: bounce 1s infinite alternate; }
h1 { font-size: 30px; }
#message { font-size: 22px; }
@keyframes bounce {
  from { transform: scale(1); }
  to { transform: scale(1.25); }
}
.particle {
  position: fixed;
  top: -40px;
  font-size: 25px;
  animation: fall 5s linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>
<body>
<div class="card">
  <div id="emoji">❤️</div>
  <h1 id="title">A Special Surprise!</h1>
  <div id="message">You are very special ❤️</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'love';
const name = params.get('name') || 'Someone Special';
const msg = params.get('msg') || 'You are very special!';

const themes = {
 love: ['❤️','A Message of Love'],
 luck: ['🍀','Good Luck!'],
 surprise: ['🎁','A Surprise For You'],
 flower: ['🌹','Flowers For You']
};

const selected = themes[type] || themes.love;
document.getElementById('emoji').textContent = selected[0];
document.getElementById('title').textContent = selected[1];
document.getElementById('message').textContent = name + ' — ' + msg;

const icons = ['❤️','🌹','✨','💖','🌸','⭐'];
for(let i=0;i<22;i++){
 let p=document.createElement('div');
 p.className='particle';
 p.textContent=icons[i%icons.length];
 p.style.left=Math.random()*100+'%';
 p.style.animationDelay=Math.random()*5+'s';
 document.body.appendChild(p);
}
</script>
</body>
</html>
