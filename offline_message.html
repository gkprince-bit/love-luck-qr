
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love & Luck Offline Message</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg,#ffe0ec,#e0e7ff);
  padding: 20px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  max-width: 400px;
  margin: 30px auto;
  animation: fade 1.5s ease;
}
h1 {
  animation: rainbow 4s linear infinite;
}
.heart {
  font-size: 55px;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  to { transform: scale(1.3); }
}
@keyframes fade {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes rainbow {
  0% { color: red; }
  25% { color: orange; }
  50% { color: green; }
  75% { color: blue; }
  100% { color: purple; }
}
</style>
</head>
<body>
<div class="card">
<h1>Love & Luck</h1>
  <input id="inputName" type="text" placeholder="अपना नाम लिखें">

<br><br>

<input id="inputMessage" type="text" placeholder="अपना मैसेज लिखें">

<br><br>

<button onclick="showMessage()">Show Message</button>
<div class="heart">❤️</div>
<h2 id="name">आपके लिए</h2>
<p id="message">आप बहुत खास हैं!</p>
</div>
<script>
const params = new URLSearchParams(location.search);
document.getElementById("name").textContent =
  params.get("name") || "आपके लिए";
document.getElementById("message").textContent =
  params.get("msg") || "आप बहुत खास हैं!";
  function showMessage(){
  const name = document.getElementById("inputName").value.trim();
  const msg = document.getElementById("inputMessage").value.trim();

  document.getElementById("name").textContent = name || "आपके लिए";
  document.getElementById("message").textContent = msg || "आप बहुत खास हैं!";
  }
</script>
</body>
</html>
