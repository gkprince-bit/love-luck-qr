
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love & Luck QR Designs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;text-align:center;
 font-family:Arial;color:white;
 background:linear-gradient(135deg,#170b30,#70265c,#171c42);
}
.card{
 max-width:450px;margin:20px auto;padding:22px;
 background:#ffffff18;border-radius:20px;
}
h1{color:#ff8acb}
input,select,button{
 width:100%;padding:14px;margin:9px 0;
 border:0;border-radius:10px;font-size:16px;
}
button{
 background:#ff399e;color:white;
 font-weight:bold;
}
#qrcode{
 display:inline-block;background:white;
 padding:15px;border-radius:15px;margin:15px;
}
#qrcode img,#qrcode canvas{
 max-width:100%;height:auto!important;
}
#qrcode.glow{
 box-shadow:0 0 20px #ff55cc,0 0 40px #ff55cc;
}
#qrcode.round{border-radius:35px}
#qrcode.rainbow{filter:hue-rotate(90deg)}
#qrcode.heart{border:5px solid #ff5ca8}
.small{color:#ddd;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>❤️ Love & Luck QR ❤️</h1>
<p>अपना पसंदीदा QR Design चुनें</p>

<input id="data" placeholder="नाम या लिंक लिखें">

<select id="design">
<option value="normal">Normal Design</option>
<option value="glow">Glow Design</option>
<option value="round">Rounded Frame</option>
<option value="rainbow">Rainbow Effect</option>
<option value="heart">Heart Theme</option>
</select>

<button onclick="generate()">Generate QR</button>

<div id="qrcode"></div>

<button onclick="downloadQR()">Download QR</button>
<p class="small">QR Scan करने के लिए पर्याप्त contrast रखें।</p>
</div>

<script>
function generate(){
 let value=document.getElementById("data").value.trim();
 if(!value){alert("पहले नाम या लिंक लिखें");return;}
 if(typeof QRCode==="undefined"){
 alert("QR Library लोड नहीं हुई। इंटरनेट चेक करें।");
 return;
 }

 let box=document.getElementById("qrcode");
 box.innerHTML="";
 box.className="";

 let design=document.getElementById("design").value;
 if(design!=="normal")box.classList.add(design);

 new QRCode(box,{
 text:value,width:220,height:220,
 colorDark:"#111111",
 colorLight:"#ffffff",
 correctLevel:QRCode.CorrectLevel.H
 });
}

function downloadQR(){
 let box=document.getElementById("qrcode");
 let canvas=box.querySelector("canvas");
 let img=box.querySelector("img");
 let url=canvas?canvas.toDataURL("image/png"):img?img.src:null;
 if(!url){alert("पहले QR बनाएं");return;}
 let a=document.createElement("a");
 a.href=url;a.download="love-luck-design.png";
 a.click();
}
</script>
</body>
</html>
